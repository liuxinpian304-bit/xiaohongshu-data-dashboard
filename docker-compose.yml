services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: xhs_dashboard
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xhs_dashboard"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./packages/database/docker/init-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
